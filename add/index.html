<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add me on LiftCue</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        background: #04121c;
        color: #f2f4f8;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      a.btn {
        display: inline-block;
        background: #22d3ee;
        color: #04121c;
        padding: 14px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        margin: 8px;
      }
      p {
        color: #9aa3b2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Add me on LiftCue</h1>
      <p>AI form feedback for your lifts.</p>
      <a class="btn" id="open" href="#">Open in LiftCue</a>
      <p>
        <a id="store" style="color: #22d3ee" href="#">Get LiftCue on the App Store</a>
      </p>
    </main>
    <script>
      var APP_STORE_URL = 'https://apps.apple.com/us/app/liftcue-ai-lifting-coach/id6792940755';
      document.getElementById('store').href = APP_STORE_URL;
      var u = new URLSearchParams(location.search).get('u') || '';
      if (/^[a-z0-9_]{3,20}$/.test(u)) {
        document.getElementById('title').textContent = 'Add @' + u + ' on LiftCue';
        document.getElementById('open').href = 'liftcue://add/' + u;
      } else {
        document.getElementById('open').style.display = 'none';
      }
    </script>
  </body>
</html>
