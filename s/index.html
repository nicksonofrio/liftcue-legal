<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Rate my lift on LiftCue</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rate my lift on LiftCue" />
    <meta property="og:description" content="AI form feedback for your lifts. Tap to watch." />
    <meta property="og:image" content="https://liftcue.coach/assets/og-post.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="stylesheet" href="../assets/share.css" />
  </head>
  <body>
    <main>
      <img src="../assets/icon.png" alt="" />
      <h1>Rate my lift</h1>
      <p>
        A friend shared a lift with you. Watch it and rate their form in LiftCue — AI form feedback

      <a id="open" class="btn primary" href="#">Open in LiftCue</a>
      <a id="store" class="btn secondary" href="#">Get LiftCue on the App Store</a>
      <p class="hint">Installed it? Tap the link in your message again to open it in the app.</p>
    </main>
    <script src="../assets/share.js"></script>
